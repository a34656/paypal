# Local PostgreSQL for AEGIS. One dialect everywhere (dev, test, prod): PostgreSQL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_local_dev
      POSTGRES_DB: aegis
    ports:
      - "5433:5432"
    volumes:
      - aegis-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  aegis-pgdata:
